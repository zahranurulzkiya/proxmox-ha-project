dir: local
	path /var/lib/vz
	content backup,iso,vztmpl

lvmthin: local-lvm
	thinpool data
	vgname pve
	content images,rootdir

nfs: nfs-storage
	export /srv/proxmox-share
	path /mnt/pve/nfs-storage
	server 192.168.122.1
	content images
	nodes pve-node2,pve-node1
	prune-backups keep-all=1
